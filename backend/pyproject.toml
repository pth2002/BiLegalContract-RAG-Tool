[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-review-tool"
version = "0.1.0"
description = "Local AI-powered contract review tool with Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "ollama>=0.1.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "httpx>=0.26.0",
    "json-repair>=0.30.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "sentence-transformers>=2.7.0",
    "protobuf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
